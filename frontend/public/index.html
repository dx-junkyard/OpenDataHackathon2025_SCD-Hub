<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>課題共創ダッシュボード（スマホMock）</title>
  <style>
    :root{
      --bg:#f8fafc; --panel:#ffffff; --muted:#64748b; --text:#1e293b; --line:#e2e8f0;
      --accent:#0891b2; --accent-2:#0284c7; --ok:#059669; --warn:#d97706;
      --touch:56px; --radius:16px; --shadow:0 6px 18px rgba(0,0,0,.1);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      background:linear-gradient(180deg, #f1f5f9, #e2e8f0 50%, #f1f5f9 100%); color:var(--text);}
    #app{height:100%; display:flex; flex-direction:column}
    header{position:sticky; top:0; z-index:5; backdrop-filter:saturate(130%) blur(8px); background:rgba(255,255,255,.9);
      border-bottom:1px solid var(--line); padding:10px 16px; display:flex; align-items:center; gap:12px;}
    header h1{font-size:16px; margin:0; letter-spacing:.2px}
    header .chip{padding:4px 10px; border-radius:999px; background:#e0f2fe; color:#0c4a6e; border:1px solid #bae6fd; font-size:12px}
    main{flex:1; overflow:auto; padding:12px 12px 92px}

    .card{background:linear-gradient(180deg,#ffffff,#f8fafc); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px;}
    .card + .card{margin-top:12px}
    .card-title{font-size:15px; margin:0 0 6px}
    .muted{color:var(--muted); font-size:13px}
    .row{display:flex; align-items:center; gap:10px}
    .tag{border:1px solid #cbd5e1; color:#475569; background:#f1f5f9; padding:4px 8px; border-radius:999px; font-size:12px}
    .news-card{display:flex; align-items:flex-start;}
    .btn{height:40px; padding:0 14px; border-radius:12px; border:1px solid #cbd5e1; color:#475569; background:#ffffff; cursor:pointer}
    .btn.primary{border-color:#0891b2; background:linear-gradient(180deg,#0891b2,#0e7490); color:#ffffff}
    .btn.danger{border-color:#dc2626; background:#fee2e2; color:#991b1b}
    .btn.ghost{background:transparent}
    .btn.block{display:block; width:100%}

    /* Bottom Nav */
    nav{position:fixed; bottom:0; left:0; right:0; z-index:10; background:rgba(255,255,255,.95); backdrop-filter:blur(8px); border-top:1px solid var(--line)}
    nav .bar{display:grid; grid-template-columns:repeat(6,1fr);}
    nav button{height:var(--touch); background:transparent; color:var(--muted); border:none; font-size:11px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px}
    nav button[aria-current="page"]{color:var(--accent)}
    .ico{font-size:22px; line-height:0}

    .list{display:flex; flex-direction:column; gap:12px}
    .pill-tabs{display:flex; gap:8px; overflow:auto; padding-bottom:8px}
    .pill-tabs .pill{white-space:nowrap; padding:8px 12px; border-radius:999px; border:1px solid #cbd5e1; background:#f8fafc; color:#64748b; font-size:13px}
    .pill[aria-selected="true"]{background:#0891b2; color:#ffffff; border-color:#0891b2}

    .slider{width:100%}
    .score{font-size:12px; color:#9bb4d1}
    .kanban-hint{font-size:12px; color:#88a3c5}

    .kpi-grid{display:grid; grid-template-columns:1fr; gap:12px}
    .kpi{padding:12px; border-radius:14px; border:1px solid #e2e8f0; background:linear-gradient(180deg,#ffffff,#f8fafc)}
    .kpi h3{margin:0 0 6px; font-size:14px}
    .spark{width:100%; height:64px}
    .kpi .summary{display:flex; align-items:center; justify-content:space-between}

    .modal{position:fixed; inset:0; z-index:20; display:none; background:rgba(0,0,0,.3);}
    .modal[open]{display:flex; align-items:flex-end; justify-content:center;}
    .modal .scrim{position:absolute; inset:0; background:transparent; cursor:pointer;}
    .modal .panel{position:relative; width:100%; max-width:500px; max-height:86%; background:linear-gradient(180deg,#ffffff,#f8fafc); border-radius:16px 16px 0 0; border:1px solid #e2e8f0; box-shadow:var(--shadow); padding:14px; overflow:auto; margin-bottom:0;}
    .modal header{position:sticky; top:0; background:transparent; backdrop-filter:none; border-bottom:none; padding:0 0 8px; margin-bottom:8px}
    .modal header h2{font-size:16px; margin:0}

    .helper{font-size:12px; color:#64748b}
    .field{margin:10px 0}
    label{font-size:12px; color:#64748b}
    input[type="text"], textarea, select{width:100%; padding:12px; border-radius:12px; border:1px solid #cbd5e1; background:#ffffff; color:#1e293b}
    textarea{min-height:80px}
    .chips{display:flex; gap:6px; flex-wrap:wrap}
    .chip-btn{padding:6px 10px; border-radius:999px; border:1px solid #cbd5e1; background:#f8fafc; color:#475569; font-size:12px}
    .chip-btn.active{border-color:#0891b2; background:#0891b2; color:#ffffff}

    .toast{position:fixed; bottom:92px; left:50%; transform:translateX(-50%); background:#0891b2; border:1px solid #0e7490; color:#ffffff; padding:10px 12px; border-radius:12px; box-shadow:var(--shadow); display:none; z-index:40}
    .toast[show]{display:block}

    .divider{height:1px; background:#e2e8f0; margin:10px 0}
    .empty{border:1px dashed #cbd5e1; padding:16px; border-radius:16px; text-align:center; color:#64748b; font-size:14px}
    .bubble{padding:8px 10px; border-radius:10px; border:1px solid #e2e8f0; background:#fff; margin:4px 0; font-size:13px}
  </style>
</head>
<body>
<div id="app">
  <header>
    <div style="font-size:20px">🌐</div>
    <h1>課題共創ダッシュボード</h1>
    <span class="chip">渋谷区・MVP</span>
  </header>

  <main>
    <!-- NEWS -->
    <section id="screen-news" class="screen" data-title="ニュース">
      <div class="pill-tabs" id="newsFilters" aria-label="カテゴリ">
        <button class="pill" data-tag="all" aria-selected="true">すべて</button>
        <button class="pill" data-tag="子育て">子育て</button>
        <button class="pill" data-tag="観光">観光</button>
        <button class="pill" data-tag="移動">移動</button>
        <button class="pill" data-tag="安全">安全</button>
      </div>
      <div id="newsList" class="list"></div>
    </section>

    <!-- COMMUNITY JOIN -->
    <section id="screen-community-join" class="screen" data-title="コミュ参加" hidden>
      <div class="pill-tabs" id="commTabs">
        <button class="pill" data-mode="popular" aria-selected="true">人気</button>
        <button class="pill" data-mode="new">新着</button>
        <button class="pill" data-mode="suggest">おすすめ</button>
      </div>
      <div id="communityList" class="list"></div>
    </section>

    <!-- COMMUNITY DETAIL -->
    <section id="screen-community" class="screen" data-title="コミュ" hidden>
      <div class="card" id="communityHead">
        <h3 class="card-title" id="commTitle">コミュニティ</h3>
        <div class="muted" id="commMeta"></div>
        <div class="row" style="margin-top:8px; gap:8px;">
          <button class="btn" id="switchCommunity">他のコミュを見る</button>
          <button class="btn" id="newThreadBtn">＋ スレッド作成</button>
          <button class="btn primary" id="newIssueInComm">＋ 課題を作成</button>
        </div>
      </div>
      <div class="pill-tabs" id="commDetailTabs" style="margin-top:12px">
        <button class="pill" data-tab="threads" aria-selected="true">スレッド</button>
        <button class="pill" data-tab="issues">課題カード</button>
      </div>
      <div id="commThreadsTab" class="comm-tab-content">
        <div id="threadList" class="list"></div>
      </div>
      <div id="commIssuesTab" class="comm-tab-content" hidden>
        <div id="communityIssueList" class="list"></div>
      </div>
    </section>

    <!-- ISSUES -->
    <section id="screen-issues" class="screen" data-title="課題ボード" hidden>
      <div class="row" style="justify-content:space-between; margin-bottom:8px">
        <div class="kanban-hint">影響度と実現性で優先度を決めましょう</div>
        <button class="btn" id="newIssueBtn">＋ 課題を作成</button>
      </div>
      <div id="issueList" class="list"></div>
    </section>

    <!-- DASHBOARD -->
    <section id="screen-dash" class="screen" data-title="ダッシュボード" hidden>
      <div id="kpiGrid" class="kpi-grid"></div>
      <div class="divider"></div>
      <button class="btn block" id="addAnnotationBtn">注釈を追加（施策開始など）</button>
    </section>

    <!-- MY PAGE -->
    <section id="screen-me" class="screen" data-title="マイページ" hidden>
      <div class="card">
        <h3 class="card-title">参加中のコミュニティ</h3>
        <div id="myComms" class="chips"></div>
        <div class="divider"></div>
        <div class="row" style="justify-content:space-between">
          <span class="muted">貢献バッジ</span>
          <span>🏅×<span id="badgeCount">0</span></span>
        </div>
      </div>
      <div class="card" style="margin-top:12px">
        <h3 class="card-title">私の課題カード</h3>
        <div id="myIssues" class="list"></div>
      </div>
    </section>
  </main>

  <!-- Bottom Nav -->
  <nav>
    <div class="bar">
      <button data-target="news" aria-current="page"><div class="ico">📰</div>ニュース</button>
      <button data-target="community"><div class="ico">👥</div>コミュ</button>
      <button data-target="community-join"><div class="ico">➕</div>コミュ参加</button>
      <button data-target="issues"><div class="ico">🗂️</div>課題</button>
      <button data-target="dash"><div class="ico">📊</div>ダッシュ</button>
      <button data-target="me"><div class="ico">👤</div>マイ</button>
    </div>
  </nav>

  <!-- Detail Modal -->
  <dialog id="detailModal" class="modal" aria-label="詳細情報">
    <div class="scrim" data-close></div>
    <div class="panel">
      <header class="row" style="justify-content:space-between">
        <h2>詳細情報</h2>
        <div class="row" style="gap:8px">
          <button class="btn primary" id="detailToIssue">課題カードを作る</button>
          <button class="btn ghost" data-close>閉じる</button>
        </div>
      </header>
      <div id="detailContext" class="helper">ニュースの詳細情報とAI分析</div>
      <div class="divider"></div>
      <div class="card">
        <h3 class="card-title">概要</h3>
        <div id="detailSummary" class="muted"></div>
        <div id="detailLink" style="margin-top:8px"></div>
      </div>
      <div class="card">
        <h3 class="card-title">AIとチャット</h3>
        <div id="chatArea" style="max-height:300px; overflow-y:auto; border:1px solid #e2e8f0; border-radius:8px; padding:8px; background:#f8fafc; margin-bottom:8px;">
          <div id="chatMessages"></div>
        </div>
        <div class="row" style="gap:8px">
          <input type="text" id="chatInput" placeholder="自由に入力してください..." style="flex:1; margin:0;">
          <button class="btn primary" id="sendChat">送信</button>
        </div>
      </div>
    </div>
  </dialog>

  <!-- Issue Create/Edit Modal -->
  <dialog id="issueModal" class="modal" aria-label="課題の作成">
    <div class="scrim" data-close></div>
    <div class="panel">
      <header class="row" style="justify-content:space-between">
        <h2>課題カード</h2>
        <button class="btn ghost" data-close>閉じる</button>
      </header>
      <div class="field">
        <label>タイトル</label>
        <input id="issueTitle" type="text" placeholder="例：ベビーカーでの坂道移動がつらい" />
      </div>
      <div class="field">
        <label>対象者</label>
        <input id="issueTarget" type="text" placeholder="例：子育て世帯（0–3歳）" />
      </div>
      <div class="field">
        <label>場所・時間帯</label>
        <input id="issueArea" type="text" placeholder="例：代々木上原周辺／夕方" />
      </div>
      <div class="field">
        <label>根拠（ニュース・観測など）</label>
        <textarea id="issueEvidence" placeholder="リンクやメモ（モック）"></textarea>
      </div>
      <div class="field">
        <label>KPI候補（タップで選択）</label>
        <div id="issueKpiChips" class="chips"></div>
      </div>
      <div class="row" style="gap:8px; margin-top:12px">
        <button class="btn" data-close>キャンセル</button>
        <button class="btn primary" id="issueSave">保存</button>
      </div>
    </div>
  </dialog>

  <!-- Hypothesis Builder Modal -->
  <dialog id="hypModal" class="modal" aria-label="仮説デザイン">
    <div class="scrim" data-close></div>
    <div class="panel">
      <header class="row" style="justify-content:space-between">
        <h2>仮説デザイン</h2>
        <button class="btn ghost" data-close>閉じる</button>
      </header>
      <div id="hypStepWrap">
        <div class="field">
          <label>課題</label>
          <div id="hypIssue" class="card muted"></div>
        </div>
        <div class="field">
          <label>仮説（1行で）</label>
          <input id="hypText" type="text" placeholder="例：段差回避ルート提示で移動時間が短縮される" />
        </div>
        <div class="field">
          <label>KPI（選択または追加）</label>
          <div id="hypKpiChips" class="chips"></div>
          <input id="hypKpiAdd" type="text" placeholder="KPIを追加（例：平均所要時間）" />
        </div>
        <div class="field">
          <label>データソース</label>
          <select id="hypDataSrc">
            <option>手入力ログ（モック）</option>
            <option>CSVインポート（モック）</option>
            <option>区オープンデータ（モック）</option>
          </select>
        </div>
      </div>
      <div class="row" style="gap:8px; margin-top:12px">
        <button class="btn" data-close>戻る</button>
        <button class="btn primary" id="hypFinish">MVPダッシュボードを生成</button>
      </div>
    </div>
  </dialog>

  <!-- Thread View Modal -->
  <dialog id="threadModal" class="modal" aria-label="スレッド">
    <div class="scrim" data-close></div>
    <div class="panel">
      <header class="row" style="justify-content:space-between">
        <h2 id="threadTitle">スレッド</h2>
        <button class="btn ghost" data-close>閉じる</button>
      </header>
      <div id="threadMessages" style="max-height:50vh; overflow:auto"></div>
      <div class="divider"></div>
      <div class="row" style="gap:8px">
        <input id="threadInput" type="text" placeholder="メッセージを入力..." style="flex:1;">
        <button class="btn primary" id="threadSend">送信</button>
      </div>
    </div>
  </dialog>

  <!-- New Thread Modal -->
  <dialog id="newThreadModal" class="modal" aria-label="新規スレッド作成">
    <div class="scrim" data-close></div>
    <div class="panel">
      <header class="row" style="justify-content:space-between">
        <h2>新規スレッド</h2>
        <button class="btn ghost" data-close>閉じる</button>
      </header>
      <div class="field">
        <label>タイトル</label>
        <input id="newThreadTitle" type="text" placeholder="例：送迎時のベビーカー導線について" />
      </div>
      <div class="field">
        <label>最初のメッセージ（任意）</label>
        <textarea id="newThreadFirstMsg" placeholder="話題のきっかけを入力..."></textarea>
      </div>
      <div class="row" style="gap:8px; margin-top:12px">
        <button class="btn" data-close>キャンセル</button>
        <button class="btn primary" id="createThreadBtn">作成</button>
      </div>
    </div>
  </dialog>

  <div class="toast" id="toast"></div>
</div>

  function drawSparkline(canvas, data){
    const ctx = canvas.getContext('2d');
    const w=canvas.width = canvas.clientWidth; const h=canvas.height=canvas.clientHeight;
    ctx.clearRect(0,0,w,h);
    const min=Math.min(...data), max=Math.max(...data); const pad=6;
    ctx.beginPath(); ctx.lineWidth=2; ctx.strokeStyle = '#0891b2';
    data.forEach((v,i)=>{
      const x = pad + (w-2*pad) * (i/(data.length-1));
      const y = h - pad - ( (v-min)/(max-min||1) ) * (h-2*pad);
      i? ctx.lineTo(x,y) : ctx.moveTo(x,y);
    });
    ctx.stroke();
  }

      '課題カードを作成しました。'

    } else {
      return responses[1];
