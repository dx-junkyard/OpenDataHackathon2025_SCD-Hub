<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>課題共創ダッシュボード（スマホMock）</title>
  <style>
    :root{
      --bg:#f8fafc;           /* slate-50 */
      --panel:#ffffff;        /* white */
      --muted:#64748b;        /* slate-500 */
      --text:#1e293b;         /* slate-800 */
      --line:#e2e8f0;         /* slate-200 */
      --accent:#0891b2;       /* cyan-600 */
      --accent-2:#0284c7;     /* sky-600 */
      --ok:#059669;           /* emerald-600 */
      --warn:#d97706;         /* amber-600 */
      --touch:56px;           /* min touch */
      --radius:16px;
      --shadow:0 6px 18px rgba(0,0,0,.1);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      background:linear-gradient(180deg, #f1f5f9, #e2e8f0 50%, #f1f5f9 100%); color:var(--text);
    }
    #app{height:100%; display:flex; flex-direction:column}
    header{
      position:sticky; top:0; z-index:5;
      backdrop-filter:saturate(130%) blur(8px);
      background:rgba(255,255,255,.9);
      border-bottom:1px solid var(--line);
      padding:10px 16px; display:flex; align-items:center; gap:12px;
    }
    header h1{font-size:16px; margin:0; letter-spacing:.2px}
    header .chip{padding:4px 10px; border-radius:999px; background:#e0f2fe; color:#0c4a6e; border:1px solid #bae6fd; font-size:12px}

    main{flex:1; overflow:auto; padding:12px 12px 92px}

    /* Cards */
    .card{background:linear-gradient(180deg,#ffffff,#f8fafc); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px;}
    .card + .card{margin-top:12px}
    .card-title{font-size:15px; margin:0 0 6px}
    .muted{color:var(--muted); font-size:13px}
    .row{display:flex; align-items:center; gap:10px}
    .tag{border:1px solid #cbd5e1; color:#475569; background:#f1f5f9; padding:4px 8px; border-radius:999px; font-size:12px}
    
    /* News Cards Specific */
    .news-card{display:flex; align-items:flex-start;}

    .btn{height:40px; padding:0 14px; border-radius:12px; border:1px solid #cbd5e1; color:#475569; background:#ffffff; cursor:pointer}
    .btn.primary{border-color:#0891b2; background:linear-gradient(180deg,#0891b2,#0e7490); color:#ffffff}
    .btn.ghost{background:transparent}
    .btn.block{display:block; width:100%}

    /* Bottom Nav */
    nav{position:fixed; bottom:0; left:0; right:0; z-index:10; background:rgba(255,255,255,.95); backdrop-filter:blur(8px); border-top:1px solid var(--line)}
    nav .bar{display:grid; grid-template-columns:repeat(5,1fr);}
    nav button{height:var(--touch); background:transparent; color:var(--muted); border:none; font-size:11px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px}
    nav button[aria-current="page"]{color:var(--accent)}
    .ico{font-size:22px; line-height:0}



    /* Lists */
    .list{display:flex; flex-direction:column; gap:12px}
    /* News */

    /* Community */
    .pill-tabs{display:flex; gap:8px; overflow:auto; padding-bottom:8px}
    .pill-tabs .pill{white-space:nowrap; padding:8px 12px; border-radius:999px; border:1px solid #cbd5e1; background:#f8fafc; color:#64748b; font-size:13px}
    .pill[aria-selected="true"]{background:#0891b2; color:#ffffff; border-color:#0891b2}

    /* Issue Board */
    .slider{width:100%}
    .score{font-size:12px; color:#9bb4d1}
    .kanban-hint{font-size:12px; color:#88a3c5}

    /* Dashboard */
    .kpi-grid{display:grid; grid-template-columns:1fr; gap:12px}
    .kpi{padding:12px; border-radius:14px; border:1px solid #e2e8f0; background:linear-gradient(180deg,#ffffff,#f8fafc)}
    .kpi h3{margin:0 0 6px; font-size:14px}
    .spark{width:100%; height:64px}
    .kpi .summary{display:flex; align-items:center; justify-content:space-between}

    /* Modals */
    .modal{position:fixed; inset:0; z-index:20; display:none; background:rgba(0,0,0,.3);}
    .modal[open]{display:flex; align-items:flex-end; justify-content:center;}
    .modal .scrim{position:absolute; inset:0; background:transparent; cursor:pointer;}
    .modal .panel{position:relative; width:100%; max-width:500px; max-height:86%; background:linear-gradient(180deg,#ffffff,#f8fafc); border-radius:16px 16px 0 0; border:1px solid #e2e8f0; box-shadow:var(--shadow); padding:14px; overflow:auto; margin-bottom:0;}
    .modal header{position:sticky; top:0; background:transparent; backdrop-filter:none; border-bottom:none; padding:0 0 8px; margin-bottom:8px}
    .modal header h2{font-size:16px; margin:0}

    .helper{font-size:12px; color:#64748b}
    .field{margin:10px 0}
    label{font-size:12px; color:#64748b}
    input[type="text"], textarea, select{width:100%; padding:12px; border-radius:12px; border:1px solid #cbd5e1; background:#ffffff; color:#1e293b}
    textarea{min-height:80px}
    .chips{display:flex; gap:6px; flex-wrap:wrap}
    .chip-btn{padding:6px 10px; border-radius:999px; border:1px solid #cbd5e1; background:#f8fafc; color:#475569; font-size:12px}
    .chip-btn.active{border-color:#0891b2; background:#0891b2; color:#ffffff}

    .toast{position:fixed; bottom:92px; left:50%; transform:translateX(-50%); background:#0891b2; border:1px solid #0e7490; color:#ffffff; padding:10px 12px; border-radius:12px; box-shadow:var(--shadow); display:none; z-index:40}
    .toast[show]{display:block}

    .divider{height:1px; background:#e2e8f0; margin:10px 0}

    .empty{border:1px dashed #cbd5e1; padding:16px; border-radius:16px; text-align:center; color:#64748b; font-size:14px}
  </style>
</head>
<body>
<div id="app">
  <header>
    <div style="font-size:20px">🌐</div>
    <h1>課題共創ダッシュボード</h1>
    <span class="chip">渋谷区・MVP</span>
  </header>

  <main>
    <!-- NEWS -->
    <section id="screen-news" class="screen" data-title="ニュース">
      <div class="pill-tabs" id="newsFilters" aria-label="カテゴリ">
        <button class="pill" data-tag="all" aria-selected="true">すべて</button>
        <button class="pill" data-tag="子育て">子育て</button>
        <button class="pill" data-tag="観光">観光</button>
        <button class="pill" data-tag="移動">移動</button>
        <button class="pill" data-tag="安全">安全</button>
      </div>
      <div id="newsList" class="list"></div>
    </section>

    <!-- COMMUNITY -->
    <section id="screen-community" class="screen" data-title="コミュニティ" hidden>
      <div class="pill-tabs" id="commTabs">
        <button class="pill" data-mode="popular" aria-selected="true">人気</button>
        <button class="pill" data-mode="new">新着</button>
        <button class="pill" data-mode="suggest">おすすめ</button>
      </div>
      <div id="communityList" class="list"></div>
    </section>

    <!-- ISSUES -->
    <section id="screen-issues" class="screen" data-title="課題ボード" hidden>
      <div class="row" style="justify-content:space-between; margin-bottom:8px">
        <div class="kanban-hint">影響度と実現性で優先度を決めましょう</div>
        <button class="btn" id="newIssueBtn">＋ 課題を作成</button>
      </div>
      <div id="issueList" class="list"></div>
    </section>

    <!-- DASHBOARD -->
    <section id="screen-dash" class="screen" data-title="ダッシュボード" hidden>
      <div id="kpiGrid" class="kpi-grid"></div>
      <div class="divider"></div>
      <button class="btn block" id="addAnnotationBtn">注釈を追加（施策開始など）</button>
    </section>

    <!-- MY PAGE -->
    <section id="screen-me" class="screen" data-title="マイページ" hidden>
      <div class="card">
        <h3 class="card-title">参加中のコミュニティ</h3>
        <div id="myComms" class="chips"></div>
        <div class="divider"></div>
        <div class="row" style="justify-content:space-between">
          <span class="muted">貢献バッジ</span>
          <span>🏅×<span id="badgeCount">0</span></span>
        </div>
      </div>
      <div class="card" style="margin-top:12px">
        <h3 class="card-title">私の課題カード</h3>
        <div id="myIssues" class="list"></div>
      </div>
    </section>
  </main>

  <!-- Bottom Nav -->
  <nav>
    <div class="bar">
      <button data-target="news" aria-current="page"><div class="ico">📰</div>ニュース</button>
      <button data-target="community"><div class="ico">👥</div>コミュ</button>
      <button data-target="issues"><div class="ico">🗂️</div>課題</button>
      <button data-target="dash"><div class="ico">📊</div>ダッシュ</button>
      <button data-target="me"><div class="ico">👤</div>マイ</button>
    </div>
  </nav>



  <!-- Detail Modal -->
  <dialog id="detailModal" class="modal" aria-label="詳細情報">
    <div class="scrim" data-close></div>
    <div class="panel">
      <header class="row" style="justify-content:space-between">
        <h2>詳細情報</h2>
        <div class="row" style="gap:8px">
          <button class="btn primary" id="detailToIssue">課題カードを作る</button>
          <button class="btn ghost" data-close>閉じる</button>
        </div>
      </header>
      <div id="detailContext" class="helper">ニュースの詳細情報とAI分析</div>
      <div class="divider"></div>
      <div class="card">
        <h3 class="card-title">要約</h3>
        <div id="detailSummary" class="muted"></div>
      </div>

      <div class="card">
        <h3 class="card-title">KPI候補</h3>
        <div id="detailKpis" class="chips"></div>
      </div>
      <div class="card">
        <h3 class="card-title">AIとチャット</h3>
        <div id="chatArea" style="max-height:300px; overflow-y:auto; border:1px solid #e2e8f0; border-radius:8px; padding:8px; background:#f8fafc; margin-bottom:8px;">
          <div id="chatMessages"></div>
        </div>
        <div class="row" style="gap:8px">
          <input type="text" id="chatInput" placeholder="AIに質問する..." style="flex:1; margin:0;">
          <button class="btn primary" id="sendChat">送信</button>
        </div>
      </div>
    </div>
  </dialog>

  <!-- Issue Create/Edit Modal -->
  <dialog id="issueModal" class="modal" aria-label="課題の作成">
    <div class="scrim" data-close></div>
    <div class="panel">
      <header class="row" style="justify-content:space-between">
        <h2>課題カード</h2>
        <button class="btn ghost" data-close>閉じる</button>
      </header>
      <div class="field">
        <label>タイトル</label>
        <input id="issueTitle" type="text" placeholder="例：ベビーカーでの坂道移動がつらい" />
      </div>
      <div class="field">
        <label>対象者</label>
        <input id="issueTarget" type="text" placeholder="例：子育て世帯（0–3歳）" />
      </div>
      <div class="field">
        <label>場所・時間帯</label>
        <input id="issueArea" type="text" placeholder="例：代々木上原周辺／夕方" />
      </div>
      <div class="field">
        <label>根拠（ニュース・観測など）</label>
        <textarea id="issueEvidence" placeholder="リンクやメモ（モック）"></textarea>
      </div>
      <div class="field">
        <label>KPI候補（タップで選択）</label>
        <div id="issueKpiChips" class="chips"></div>
      </div>
      <div class="row" style="gap:8px; margin-top:12px">
        <button class="btn" data-close>キャンセル</button>
        <button class="btn primary" id="issueSave">保存</button>
      </div>
    </div>
  </dialog>

  <!-- Hypothesis Builder Modal -->
  <dialog id="hypModal" class="modal" aria-label="仮説デザイン">
    <div class="scrim" data-close></div>
    <div class="panel">
      <header class="row" style="justify-content:space-between">
        <h2>仮説デザイン</h2>
        <button class="btn ghost" data-close>閉じる</button>
      </header>
      <div id="hypStepWrap">
        <div class="field">
          <label>課題</label>
          <div id="hypIssue" class="card muted"></div>
        </div>
        <div class="field">
          <label>仮説（1行で）</label>
          <input id="hypText" type="text" placeholder="例：段差回避ルート提示で移動時間が短縮される" />
        </div>
        <div class="field">
          <label>KPI（選択または追加）</label>
          <div id="hypKpiChips" class="chips"></div>
          <input id="hypKpiAdd" type="text" placeholder="KPIを追加（例：平均所要時間）" />
        </div>
        <div class="field">
          <label>データソース</label>
          <select id="hypDataSrc">
            <option>手入力ログ（モック）</option>
            <option>CSVインポート（モック）</option>
            <option>区オープンデータ（モック）</option>
          </select>
        </div>
      </div>
      <div class="row" style="gap:8px; margin-top:12px">
        <button class="btn" data-close>戻る</button>
        <button class="btn primary" id="hypFinish">MVPダッシュボードを生成</button>
      </div>
    </div>
  </dialog>

  <div class="toast" id="toast"></div>
</div>

<script>
  // ------------------ Mock Data ------------------
  const state = {
    selectedNews: null,
    selectedIssue: null,
    badges: 0,
    myCommunities: [],
    news:[
      {id:1, title:"保育園の送迎混雑の時間帯を分散へ", summary:"朝8時台に送迎が集中する保育園で、導線の改善と時差利用の試行が始まりました。", tags:["子育て","安全"], thumb:""},
      {id:2, title:"原宿駅周辺の歩行回遊を促進", summary:"歩行者空間の再編で、回遊ルートの案内サインを実証。観光満足度の向上を目指します。", tags:["観光","移動"], thumb:""},
      {id:3, title:"坂道移動の負担軽減へ ルート案内の実験", summary:"ベビーカーや高齢者に配慮した段差・勾配回避ルートを提示する実証。", tags:["移動","安全","子育て"], thumb:""}
    ],
    communities:[
      {id:"c1", name:"子育て@渋谷", members:1320, hot:"送迎導線の改善"},
      {id:"c2", name:"観光と回遊性", members:980, hot:"表参道の混雑時間帯"},
      {id:"c3", name:"歩きやすい渋谷", members:1540, hot:"坂道・段差マップ"}
    ],
    issues:[],
    dashboards:[
      {id:"k1", title:"観光回遊ルートの満足度", unit:"pt", current:78, target:85, data:[62,65,66,70,71,75,78], note:"案内サインの実証"}
    ]
  };

  const KPI_LIB = {
    子育て:["送迎待ち時間(分)","ベビーカー通行満足度(点)","段差箇所件数"],
    観光:["観光満足度(点)","回遊距離(㎞)","滞在時間(分)"],
    移動:["平均所要時間(分)","移動成功率(%)","危険箇所報告数"],
    安全:["ヒヤリハット報告数","混雑度指数","歩道幅不足箇所"]
  };

  // ------------------ Helpers ------------------
  const $ = (q, root=document)=>root.querySelector(q);
  const $$ = (q, root=document)=>Array.from(root.querySelectorAll(q));
  function toast(msg){ const t=$('#toast'); t.textContent=msg; t.setAttribute('show',''); setTimeout(()=>t.removeAttribute('show'), 1700); }
  function openModal(sel){ 
    const d=$(sel); 
    if(d) {
      d.setAttribute('open',''); 
      // スクロール防止
      document.body.style.overflow = 'hidden';
    }
  }
  function closeModal(e){ 
    const d=e.target.closest('.modal'); 
    if(!d) return; 
    d.removeAttribute('open'); 
    // スクロール復活
    document.body.style.overflow = '';
    document.body.style.position = '';
  }
  function chip(el){ el.classList.toggle('active'); }

  // ------------------ Navigation ------------------
  $$('#app nav button').forEach(btn=>btn.addEventListener('click',()=>{
    const target = btn.dataset.target; // news/community/issues/dash/me
    $$('.screen').forEach(s=>s.hidden = s.id!==`screen-${target}`);
    $$('#app nav button').forEach(b=>b.removeAttribute('aria-current'));
    btn.setAttribute('aria-current','page');
    // header title update
    const title = $(`#screen-${target}`).dataset.title || '';
    $('header h1').textContent = `課題共創ダッシュボード — ${title}`;
  }));

  // ------------------ News ------------------
  function renderNews(tag='all'){
    const box = $('#newsList'); box.innerHTML='';
    const items = state.news.filter(n=> tag==='all' || n.tags.includes(tag));
    if(!items.length){ box.innerHTML = `<div class="empty">該当ニュースがありません</div>`; return; }
    items.forEach(n=>{
      const card = document.createElement('div'); card.className='card news-card';
      card.innerHTML = `
        <div style="flex:1">
          <h3 class="card-title">${n.title}</h3>
          <div class="muted">${n.summary}</div>
          <div class="chips" style="margin-top:6px">${n.tags.map(t=>`<span class='tag'>${t}</span>`).join('')}</div>
        </div>
        <div style="display:flex; align-items:flex-start; margin-left:16px; padding-top:4px;">
          <button class="btn" data-act="detail" data-id="${n.id}" style="min-width:60px; height:32px; font-size:12px;">詳細</button>
        </div>`;
      box.appendChild(card);
    })
  }
  
  $('#newsFilters').addEventListener('click', (e)=>{
    const pill=e.target.closest('.pill'); if(!pill) return; $$('#newsFilters .pill').forEach(p=>p.removeAttribute('aria-selected')); pill.setAttribute('aria-selected','true');
    renderNews(pill.dataset.tag);
  });

  $('#newsList').addEventListener('click', (e)=>{
    const btn = e.target.closest('button'); if(!btn) return;
    const id = Number(btn.dataset.id); const item = state.news.find(n=>n.id===id); state.selectedNews = item;
    if(btn.dataset.act==='detail') { openDetailWith(item); }
  });

  // ------------------ Communities ------------------
  function renderCommunities(){
    const box = $('#communityList'); box.innerHTML='';
    state.communities.forEach(c=>{
      const card=document.createElement('div'); card.className='card';
      card.innerHTML = `
        <div class="row" style="justify-content:space-between">
          <div>
            <h3 class="card-title">${c.name}</h3>
            <div class="muted">メンバー ${c.members}｜Hot: ${c.hot}</div>
          </div>
          <button class="btn primary" data-join="${c.id}">参加</button>
        </div>
      `;
      box.appendChild(card);
    })
  }
  $('#communityList').addEventListener('click', (e)=>{
    const join=e.target.closest('button[data-join]'); if(!join) return;
    const id=join.dataset.join; const c=state.communities.find(x=>x.id===id);
    if(!state.myCommunities.includes(c.name)) state.myCommunities.push(c.name);
    renderMy(); toast(`${c.name} に参加しました`);
  })

  // ------------------ Issues ------------------
  function renderIssues(){
    const box = $('#issueList'); box.innerHTML='';
    if(!state.issues.length){ box.innerHTML = `<div class="empty">まだ課題がありません。ニュースから「課題化」しましょう。</div>`; return; }
    // scoring & sort
    const issues = [...state.issues].sort((a,b)=> (b.impact*b.feasible) - (a.impact*a.feasible));
    issues.forEach(i=>{
      const card=document.createElement('div'); card.className='card';
      card.innerHTML = `
        <h3 class="card-title">${i.title}</h3>
        <div class="muted">対象：${i.target||'-'}｜場所：${i.area||'-'}</div>
        <div class="muted" style="margin-top:6px">KPI候補：${i.kpis.length? i.kpis.join('、') : '未選択'}</div>
        <div class="row" style="margin-top:10px; gap:10px; align-items:center">
          <span class="score">影響度</span><input class="slider" type="range" min="1" max="5" value="${i.impact}" data-id="${i.id}" data-kind="impact">
        </div>
        <div class="row" style="margin-top:6px; gap:10px; align-items:center">
          <span class="score">実現性</span><input class="slider" type="range" min="1" max="5" value="${i.feasible}" data-id="${i.id}" data-kind="feasible">
        </div>
        <div class="row" style="margin-top:10px; gap:8px">
          <button class="btn" data-act="similar" data-id="${i.id}">類似課題</button>
          <button class="btn" data-act="hyp" data-id="${i.id}">仮説デザイン</button>
        </div>
      `;
      box.appendChild(card);
    })
  }

  $('#issueList').addEventListener('input', (e)=>{
    const s = e.target.closest('.slider'); if(!s) return; const id=s.dataset.id; const k=s.dataset.kind; const it=state.issues.find(x=>x.id==id); it[k]=Number(s.value); 
  });
  $('#issueList').addEventListener('change', ()=>{ renderIssues(); });

  $('#issueList').addEventListener('click', (e)=>{
    const b=e.target.closest('button'); if(!b) return; const id=b.dataset.id; const it=state.issues.find(x=>x.id==id); state.selectedIssue=it;
    if(b.dataset.act==='hyp'){ openHypWith(it); }
    if(b.dataset.act==='similar'){ showSimilar(it); }
  })

  $('#newIssueBtn').addEventListener('click', ()=>{ openIssueWith(); });

  function showSimilar(issue){
    const sim = state.issues.filter(i=> i!==issue && (i.title.includes(issue.title.split(' ')[0]) || i.kpis.some(k=>issue.kpis.includes(k))));
    if(!sim.length) return toast('類似課題は見つかりませんでした');
    toast(`類似課題 ${sim.length} 件`);
  }

  // ------------------ Dashboard ------------------
  function renderDashboard(){
    const grid = $('#kpiGrid'); grid.innerHTML='';
    if(!state.dashboards.length){ grid.innerHTML = `<div class="empty">まだダッシュボードがありません。課題から仮説を作成してください。</div>`; return; }
    state.dashboards.forEach(k=>{
      const card=document.createElement('div'); card.className='kpi';
      const latest=k.data[k.data.length-1];
      const trend = latest - k.data[Math.max(0,k.data.length-4)];
      card.innerHTML = `
        <div class="summary">
          <h3>${k.title}</h3>
          <div class="muted">目標 ${k.target}${k.unit||''}</div>
        </div>
        <canvas class="spark" data-id="${k.id}"></canvas>
        <div class="row" style="justify-content:space-between; margin-top:4px">
          <div class="muted">現在 ${k.current}${k.unit||''}</div>
          <div>${trend>=0? '↗︎' : '↘︎'} <span class="muted">直近の傾向</span></div>
        </div>`;
      grid.appendChild(card);
      // draw sparkline
      requestAnimationFrame(()=>drawSparkline($(`canvas[data-id='${k.id}']`), k.data));
    })
  }

  function drawSparkline(canvas, data){
    const ctx = canvas.getContext('2d');
    const w=canvas.width = canvas.clientWidth; const h=canvas.height=canvas.clientHeight;
    ctx.clearRect(0,0,w,h);
    const min=Math.min(...data), max=Math.max(...data); const pad=6;
    ctx.beginPath(); ctx.lineWidth=2; ctx.strokeStyle = '#0891b2';
    data.forEach((v,i)=>{
      const x = pad + (w-2*pad) * (i/(data.length-1));
      const y = h - pad - ( (v-min)/(max-min||1) ) * (h-2*pad);
      i? ctx.lineTo(x,y) : ctx.moveTo(x,y);
    });
    ctx.stroke();
  }

  // ------------------ Detail Panel ------------------
  function openDetailWith(item){
    state.selectedNews = item;
    $('#detailSummary').textContent = (item.summary || item.title).slice(0,100)+'…';
    $('#detailContext').textContent = `解析対象：${item.title||'（未選択）'}`;
    const tags = item.tags || [];
    const kpis = [...new Set(tags.flatMap(t=>KPI_LIB[t]||[]))].slice(0,6);
    $('#detailKpis').innerHTML = kpis.map(k=>`<button class="chip-btn">${k}</button>`).join('');
    
    // チャットエリアを初期化
    $('#chatMessages').innerHTML = `
      <div style="padding:8px; margin-bottom:8px; background:#e0f2fe; border-radius:8px; font-size:13px;">
        <strong>AI:</strong> このニュースについて何かご質問はありますか？
      </div>
    `;
    
    openModal('#detailModal');
  }
  $('#detailKpis').addEventListener('click', e=>{ const b=e.target.closest('.chip-btn'); if(!b) return; chip(b); });
  $('#detailToIssue').addEventListener('click', ()=>{ const picked=$$('#detailKpis .chip-btn.active').map(b=>b.textContent); openIssueWith(state.selectedNews, picked); });
  
  // チャット機能
  $('#sendChat').addEventListener('click', sendChatMessage);
  $('#chatInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
      sendChatMessage();
    }
  });
  
  function sendChatMessage() {
    const input = $('#chatInput');
    const message = input.value.trim();
    if (!message) return;
    
    // ユーザーメッセージを追加
    const userMsg = document.createElement('div');
    userMsg.style.cssText = 'padding:8px; margin-bottom:8px; background:#ffffff; border:1px solid #e2e8f0; border-radius:8px; font-size:13px; text-align:right;';
    userMsg.innerHTML = `<strong>あなた:</strong> ${message}`;
    $('#chatMessages').appendChild(userMsg);
    
    // 入力フィールドをクリア
    input.value = '';
    
    // AIの応答をシミュレート（モック）
    setTimeout(() => {
      const aiMsg = document.createElement('div');
      aiMsg.style.cssText = 'padding:8px; margin-bottom:8px; background:#e0f2fe; border-radius:8px; font-size:13px;';
      aiMsg.innerHTML = `<strong>AI:</strong> ${getMockAIResponse(message)}`;
      $('#chatMessages').appendChild(aiMsg);
      
      // チャットエリアを最下部にスクロール
      const chatArea = $('#chatArea');
      chatArea.scrollTop = chatArea.scrollHeight;
    }, 1000);
  }
  
  function getMockAIResponse(message) {
    const responses = [
      'その質問について詳しく調べてみますね。',
      '興味深い視点ですね。他の観点からも考えてみましょう。',
      'このニュースに関連するデータを確認してみます。',
      'その課題について、具体的な解決策を提案できます。',
      'より詳しい情報が必要ですね。追加の調査を行います。'
    ];
    return responses[Math.floor(Math.random() * responses.length)];
  }

  // ------------------ Issue Modal ------------------
  function openIssueWith(fromNews=null, kpiPreset=[]){
    if(fromNews){
      $('#issueTitle').value = fromNews.title.replace(/[。、]$/,'');
      $('#issueTarget').value = fromNews.tags.includes('子育て') ? '子育て世帯' : '';
      $('#issueArea').value = fromNews.tags.includes('移動') ? '駅周辺' : '';
      $('#issueEvidence').value = fromNews.summary;
      const suggested=[...new Set(fromNews.tags.flatMap(t=>KPI_LIB[t]||[]))];
      renderKpiChips($('#issueKpiChips'), suggested, kpiPreset);
    }else{
      $('#issueTitle').value = ''; $('#issueTarget').value=''; $('#issueArea').value=''; $('#issueEvidence').value='';
      renderKpiChips($('#issueKpiChips'), ["平均所要時間(分)","満足度(点)"], []);
    }
    openModal('#issueModal');
  }

  function renderKpiChips(container, list, activeList){
    container.innerHTML = list.map(k=>`<button class="chip-btn ${activeList.includes(k)?'active':''}">${k}</button>`).join('');
  }
  $('#issueKpiChips').addEventListener('click', e=>{ const b=e.target.closest('.chip-btn'); if(!b) return; chip(b); });

  $('#issueSave').addEventListener('click', ()=>{
    const title=$('#issueTitle').value.trim(); if(!title) return toast('タイトルを入力');
    const issue={
      id:String(Date.now()),
      title,
      target:$('#issueTarget').value.trim(),
      area:$('#issueArea').value.trim(),
      evidence:$('#issueEvidence').value.trim(),
      kpis: $$('#issueKpiChips .chip-btn.active').map(b=>b.textContent),
      impact:3, feasible:3
    };
    state.issues.push(issue); state.selectedIssue=issue; renderIssues(); renderMy(); toast('課題カードを保存しました');
    $('#issueModal').removeAttribute('open');
    // navigate to Issues tab
    document.querySelector('nav button[data-target="issues"]').click();
  })

  // ------------------ Hypothesis Builder ------------------
  function openHypWith(issue){
    $('#hypIssue').textContent = `${issue.title}（対象：${issue.target||'未設定'}）`;
    $('#hypText').value='';
    renderKpiChips($('#hypKpiChips'), issue.kpis.length? issue.kpis : ["平均所要時間(分)","満足度(点)"], issue.kpis);
    $('#hypKpiAdd').value='';
    $('#hypDataSrc').selectedIndex=0;
    openModal('#hypModal');
  }
  $('#hypKpiChips').addEventListener('click', e=>{ const b=e.target.closest('.chip-btn'); if(!b) return; chip(b); });
  $('#hypFinish').addEventListener('click', ()=>{
    const issue = state.selectedIssue; if(!issue) return;
    const hyp = $('#hypText').value.trim() || '仮説（モック）';
    const kpis = [ ...new Set([ ...$$('#hypKpiChips .chip-btn.active').map(b=>b.textContent), $('#hypKpiAdd').value.trim() ].filter(Boolean)) ];
    // create 1 KPI card for MVP（最初のKPIだけ）
    if(!kpis.length) { toast('KPIを選ぶか追加してください'); return; }
    const title = kpis[0];
    const base = Math.round(50+Math.random()*30);
    const seq = Array.from({length:7}, (_,i)=> base + Math.round((Math.random()*6-3) + i*Math.random()*2));
    state.dashboards.push({ id:'k'+Date.now(), title, unit: title.includes('(% )')? '%' : (title.includes('(分)')?'分':'点'), current:seq[seq.length-1], target: Math.round(base+10), data:seq, note:hyp });
    renderDashboard(); $('#hypModal').removeAttribute('open'); toast('MVPダッシュボードを追加しました');
    document.querySelector('nav button[data-target="dash"]').click();
  })

  // ------------------ My Page ------------------
  function renderMy(){
    const wrap = $('#myComms'); wrap.innerHTML = state.myCommunities.map(n=>`<span class="tag">${n}</span>`).join('') || '<span class="muted">未参加</span>';
    $('#myIssues').innerHTML = state.issues.slice(-5).map(i=>`<div class="card"><div class="row" style="justify-content:space-between"><div><div>${i.title}</div><div class="muted">KPI: ${i.kpis.join('、')||'-'}</div></div><button class="btn" data-open-hyp="${i.id}">仮説へ</button></div></div>`).join('');
    $('#badgeCount').textContent = state.badges;
  }
  $('#myIssues').addEventListener('click', (e)=>{
    const b=e.target.closest('button[data-open-hyp]'); if(!b) return; const it=state.issues.find(x=>x.id===b.dataset.openHyp); state.selectedIssue=it; openHypWith(it);
  })



  // ------------------ Modal close (scrim/btn) ------------------
  $$('.modal [data-close]').forEach(el=> el.addEventListener('click', closeModal));
  
  // ESCキーでモーダルを閉じる
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      const openModal = document.querySelector('.modal[open]');
      if (openModal) {
        closeModal({ target: openModal });
      }
    }
  });

  // ------------------ Init ------------------
  renderNews();
  renderCommunities();
  renderIssues();
  renderDashboard();
  renderMy();
</script>
</body>
</html>
