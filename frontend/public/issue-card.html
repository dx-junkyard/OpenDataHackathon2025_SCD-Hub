<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>課題カード MVP（HTML/CSS/JS）</title>
  <style>
    :root{
      --bg:#f6f8fb;--card:#fff;--text:#0f172a;--muted:#64748b;--primary:#2F7CF6;--accent:#16a34a;--warn:#ca8a04;--danger:#dc2626;--border:#e2e8f0;--chip:#eff6ff;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}
    .wrap{max-width:960px;margin:40px auto;padding:0 16px}
    h1{font-size:clamp(18px,3.4vw,28px);margin:0 0 12px}
    .sub{color:var(--muted);font-size:14px}

    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:0 6px 24px rgba(15,23,42,.06);padding:20px;}
    .row{display:flex;gap:16px;flex-wrap:wrap}
    .grow{flex:1 1 auto}

    .kv{display:grid;grid-template-columns:120px 1fr;gap:10px;margin:10px 0}
    .kv label{color:var(--muted)}

    .chips{display:flex;gap:8px;flex-wrap:wrap}
    .chip{background:var(--chip);color:#1e293b;border:1px solid #dbeafe;padding:6px 10px;border-radius:999px;font-size:12px;}
    .pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:999px;padding:6px 10px;font-size:12px}
    .pill[data-level="private"]{background:#fff7ed;border-color:#fed7aa;color:#9a3412}
    .pill[data-level="limited"]{background:#ecfeff;border-color:#a5f3fc;color:#155e75}
    .pill[data-level="aggregated"]{background:#f0fdf4;border-color:#bbf7d0;color:#166534}

    .badges{display:flex;gap:8px;flex-wrap:wrap}
    .badge{background:#f1f5f9;border:1px solid var(--border);color:#0f172a;border-radius:10px;padding:4px 8px;font-size:12px}
    .badge.is-on{background:#e0f2fe;border-color:#93c5fd}

    .toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
    button{appearance:none;border:none;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer}
    button.primary{background:var(--primary);color:#fff}
    button.secondary{background:#e9eefb;color:#183c8f}
    button.ghost{background:#fff;border:1px solid var(--border);color:#0f172a}
    button.warn{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412}
    button:disabled{opacity:.55;cursor:not-allowed}

    .divider{height:1px;background:var(--border);margin:14px 0}

    .stepper{display:flex;gap:8px;flex-wrap:wrap}
    .step{display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--border);border-radius:12px;font-size:12px;background:#fff}
    .step.is-done{background:#f0fdf4;border-color:#bbf7d0;color:#166534}

    dialog{border:none;border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.25);width:min(680px,92vw);}
    dialog::backdrop{background:rgba(2,6,23,.4)}
    .dlg{padding:18px}
    .dlg h2{margin:0 0 8px;font-size:18px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .grid .wide{grid-column:1 / -1}
    label span{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
    input[type="text"], textarea, select, input[type="date"]{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:14px}
    textarea{min-height:96px;resize:vertical}
    .hint{font-size:12px;color:var(--muted)}

    .kpi-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
    .kpi-item{display:flex;align-items:center;gap:6px;background:#f8fafc;border:1px solid var(--border);border-radius:999px;padding:6px 10px;font-size:12px}
    .kpi-item button{padding:0 6px;border-radius:8px}

    .footer-bar{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px}
    .id{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--muted);font-size:12px}

    .toast{position:fixed;inset:auto 12px 12px auto;background:#111827;color:#fff;padding:10px 12px;border-radius:10px;font-size:13px;opacity:0;transform:translateY(6px);transition:.2s}
    .toast.show{opacity:1;transform:translateY(0)}

    .consent{background:#f8fafc;border:1px dashed var(--border);border-radius:12px;padding:10px}
    details summary{cursor:pointer}
    .muted{color:var(--muted)}
    .img-preview{display:flex;gap:8px;flex-wrap:wrap}
    .img-preview img{width:88px;height:88px;object-fit:cover;border-radius:10px;border:1px solid var(--border)}
    /* added: image wrapper and delete button */
    .img-preview .img-item{position:relative;display:inline-block}
    .img-preview .del-btn{position:absolute;top:4px;right:4px;width:22px;height:22px;padding:0;display:flex;align-items:center;justify-content:center;background:#111827;color:#fff;border-radius:999px;border:1px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.2);font-size:14px;line-height:1}
    .img-preview .del-btn:hover{background:#0b1220}

    @media (max-width:640px){
      .kv{grid-template-columns:1fr}
      .grid{grid-template-columns:1fr}
      .footer-bar{flex-direction:column;align-items:flex-start}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="row" style="align-items:end;margin-bottom:16px">
      <div class="grow">
        <h1>課題カード（MVP）</h1>
        <div class="sub">ニュース→雑談→<b>課題カード化</b>→コミュニティ/行政共有（段階的同意）</div>
      </div>
      <div class="stepper" aria-label="進捗状況">
        <div class="step" id="st-draft">ドラフト</div>
        <div class="step" id="st-saved">保存</div>
        <div class="step" id="st-com">コミュ共有</div>
        <div class="step" id="st-gov">行政共有</div>
      </div>
    </header>

    <section class="card" role="region" aria-labelledby="card-title">
      <div class="kv">
        <label id="card-title">タイトル</label>
        <div id="v-title">保育料の負担軽減が分かりづらい</div>

        <label>概要</label>
        <div id="v-summary" class="muted">制度が多く、我が家が対象か判断しづらい。締切に間に合わない不安がある。</div>

        <label>KPI（最大3）</label>
        <div class="chips" id="v-kpi">
          <span class="chip">申請完了率</span>
          <span class="chip">申請リードタイム</span>
          <span class="chip">当日対応成功率</span>
        </div>

        <label>公開レベル</label>
        <div><span class="pill" id="v-privacy" data-level="private">非公開</span></div>

        <label>共有先</label>
        <div class="badges" id="v-share">
          <span class="badge" data-key="community">コミュニティ</span>
          <span class="badge" data-key="government">行政</span>
        </div>

        <label>期限</label>
        <div id="v-deadline" class="muted">—</div>

        <label>添付</label>
        <div id="v-attachments" class="img-preview"></div>
      </div>

      <div class="divider"></div>

      <div class="footer-bar">
        <div class="id" id="v-id">カードID: （未発行）</div>
        <div class="toolbar" role="toolbar" aria-label="操作">
          <button class="primary" id="btn-save-anon">匿名で保存</button>
          <button class="secondary" id="btn-save-id">実名で保存</button>
          <button class="ghost" id="btn-edit">編集</button>
          <button class="ghost" id="btn-privacy">公開レベル</button>
          <button class="ghost" id="btn-share">共有先</button>
          <button class="warn" id="btn-json">JSONをコピー</button>
          <button class="ghost" id="btn-download">JSONをDL</button>
        </div>
      </div>

      <div class="consent" style="margin-top:12px">
        <details>
          <summary>同意・操作履歴（監査ログ）</summary>
          <ul id="v-consent" class="muted" style="margin:8px 0 0 18px;line-height:1.8"></ul>
        </details>
      </div>
    </section>

    <p class="sub" style="margin-top:12px">※ このデモはフロント単体。保存はブラウザの <code>localStorage</code> に行います。</p>
  </div>

  <!-- Edit Dialog -->
  <dialog id="dlg-edit">
    <form method="dialog" class="dlg" id="form-edit">
      <h2>カードを編集</h2>
      <div class="grid">
        <label class="wide"><span>タイトル（必須・20字以内推奨）</span>
          <input type="text" id="f-title" maxlength="40" required />
        </label>
        <label class="wide"><span>概要（120字以内推奨）</span>
          <textarea id="f-summary" maxlength="240"></textarea>
        </label>
        <div class="wide">
          <span class="hint">KPI（最大3つ）</span>
          <div class="kpi-list" id="kpi-list"></div>
          <div class="row" style="margin-top:8px">
            <input type="text" id="kpi-input" placeholder="例：申請完了率" />
            <button class="ghost" id="kpi-add" type="button">追加</button>
          </div>
        </div>
        <label><span>期限（任意）</span>
          <input type="date" id="f-deadline" />
        </label>
        <label><span>画像添付（任意・複数可）</span>
          <input type="file" id="f-images" accept="image/*" multiple />
        </label>
        <div class="wide">
          <button class="ghost" type="button" id="btn-geo">位置情報を付与</button>
          <span id="geo-status" class="hint">未取得</span>
        </div>
      </div>
      <div class="row" style="justify-content:flex-end;margin-top:14px">
        <button class="ghost" value="cancel">キャンセル</button>
        <button class="primary" id="edit-save" value="default">保存</button>
      </div>
    </form>
  </dialog>

  <!-- Privacy Dialog -->
  <dialog id="dlg-privacy">
    <form method="dialog" class="dlg" id="form-privacy">
      <h2>公開レベル</h2>
      <label class="wide" style="display:block;margin:8px 0"><input type="radio" name="privacy" value="private" checked /> 非公開（自分だけ）</label>
      <label class="wide" style="display:block;margin:8px 0"><input type="radio" name="privacy" value="limited" /> 限定共有（運営・所管のみ）</label>
      <label class="wide" style="display:block;margin:8px 0"><input type="radio" name="privacy" value="aggregated" /> 集計公開（個人が特定されない形）</label>
      <div class="row" style="justify-content:flex-end;margin-top:10px">
        <button class="ghost" value="cancel">閉じる</button>
        <button class="primary" value="default">更新</button>
      </div>
    </form>
  </dialog>

  <!-- Share Dialog -->
  <dialog id="dlg-share">
    <form method="dialog" class="dlg" id="form-share">
      <h2>共有先</h2>
      <label style="display:block;margin:6px 0"><input type="checkbox" id="sh-community" /> コミュニティに共有</label>
      <label style="display:block;margin:6px 0"><input type="checkbox" id="sh-gov" /> 行政に共有</label>
      <div id="gov-opts" style="margin:8px 0 0 24px;display:none">
        <label style="display:block;margin:6px 0"><input type="radio" name="gov-level" value="limited" checked /> 限定共有（所管のみ）</label>
        <label style="display:block;margin:6px 0"><input type="radio" name="gov-level" value="aggregated" /> 集計公開（個人が特定されない形）</label>
      </div>
      <div class="row" style="justify-content:flex-end;margin-top:10px">
        <button class="ghost" value="cancel">閉じる</button>
        <button class="primary" value="default">更新</button>
      </div>
    </form>
  </dialog>

  <div class="toast" role="status" aria-live="polite" id="toast"></div>

  <script>
    const $ = (sel, root=document) => root.querySelector(sel);
    const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));

    // ---- State ----
    const state = {
      card_id: null,
      title: '保育料の負担軽減が分かりづらい',
      summary: '制度が多く、我が家が対象か判断しづらい。締切に間に合わない不安がある。',
      kpi: ['申請完了率','申請リードタイム','当日対応成功率'],
      deadline: '',
      privacy: { level: 'private', mode: 'anonymous' },
      share: { community: false, government: false, government_level: 'limited' },
      attachments: { images: [], location: null },
      consent_log: [],
      status: 'draft' // draft | saved | shared_community | shared_gov | closed
    };

    // ---- Utils ----
    const fmtTime = (d=new Date()) => new Intl.DateTimeFormat('ja-JP', {dateStyle:'medium', timeStyle:'short'}).format(d);
    const pushLog = (action, detail='') => {
      state.consent_log.unshift(`${fmtTime()}: ${action}${detail? ' — ' + detail : ''}`);
      renderConsent();
    };
    const genId = () => `SHIB-${new Date().getFullYear()}-${Math.random().toString(36).slice(2,8).toUpperCase()}`;
    const saveLocal = () => localStorage.setItem('issue-card-mvp', JSON.stringify(state));
    const loadLocal = () => { try{ const s = JSON.parse(localStorage.getItem('issue-card-mvp')); if(s) Object.assign(state, s); }catch(e){} };

    // ---- Renderers ----
    function renderAll(){
      $('#v-title').textContent = state.title;
      $('#v-summary').textContent = state.summary || '—';
      $('#v-id').textContent = `カードID: ${state.card_id || '（未発行）'}`;
      $('#v-deadline').textContent = state.deadline || '—';

      // KPI
      const vk = $('#v-kpi'); vk.innerHTML = '';
      state.kpi.slice(0,3).forEach(k => { const s = document.createElement('span'); s.className='chip'; s.textContent=k; vk.appendChild(s); });

      // Privacy
      const p = $('#v-privacy');
      p.dataset.level = state.privacy.level;
      p.textContent = state.privacy.level==='private' ? '非公開' : (state.privacy.level==='limited' ? '限定共有' : '集計公開');

      // Share badges
      $$('#v-share .badge').forEach(b => {
        const key = b.dataset.key; b.classList.toggle('is-on', !!state.share[key]);
      });

      // Images
      const att = $('#v-attachments'); att.innerHTML = '';
      state.attachments.images.forEach((src, idx) => {
        const wrap = document.createElement('span'); wrap.className = 'img-item';
        const img = new Image(); img.src = src;
        const btn = document.createElement('button'); btn.className = 'del-btn'; btn.type='button'; btn.setAttribute('aria-label','画像を削除'); btn.dataset.idx = String(idx); btn.textContent = '×';
        wrap.appendChild(img); wrap.appendChild(btn); att.appendChild(wrap);
      });

      // Stepper
      $('#st-draft').classList.toggle('is-done', state.status !== 'draft');
      $('#st-saved').classList.toggle('is-done', ['saved','shared_community','shared_gov','closed'].includes(state.status));
      $('#st-com').classList.toggle('is-done', ['shared_community','shared_gov','closed'].includes(state.status));
      $('#st-gov').classList.toggle('is-done', ['shared_gov','closed'].includes(state.status));

      saveLocal();
    }

    function renderConsent(){
      const ul = $('#v-consent'); ul.innerHTML = '';
      if(state.consent_log.length===0){ const li=document.createElement('li'); li.textContent='— まだありません'; ul.appendChild(li); return; }
      state.consent_log.forEach(line => { const li = document.createElement('li'); li.textContent = line; ul.appendChild(li); });
    }

    // ---- Toast ----
    let toastTimer=null; function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1800); }

    // ---- Actions ----
    function doSave(mode='anonymous'){
      if(!state.title.trim()) { toast('タイトルを入力してください'); return; }
      if(!state.card_id) state.card_id = genId();
      state.privacy.mode = mode==='identified' ? 'identified' : 'anonymous';
      state.status = 'saved';
      pushLog(`保存`, `${mode==='identified'?'実名':'匿名'}`);
      renderAll();
      toast('保存しました');
    }

    function openEdit(){
      $('#f-title').value = state.title;
      $('#f-summary').value = state.summary;
      $('#f-deadline').value = state.deadline || '';
      $('#geo-status').textContent = state.attachments.location ? `緯度${state.attachments.location.lat.toFixed(5)}, 経度${state.attachments.location.lng.toFixed(5)}` : '未取得';

      // KPI chips in dialog
      const list = $('#kpi-list'); list.innerHTML='';
      state.kpi.forEach((k,idx)=>{
        const el = document.createElement('span'); el.className='kpi-item'; el.innerHTML = `${k} <button type="button" data-idx="${idx}" class="ghost">×</button>`; list.appendChild(el);
      });

      $('#dlg-edit').showModal();
    }

    function applyEdit(){
      const title = $('#f-title').value.trim();
      if(!title){ toast('タイトルは必須です'); return; }
      state.title = title;
      state.summary = $('#f-summary').value.trim();
      state.deadline = $('#f-deadline').value || '';
      pushLog('編集', '本文/期限 など更新');
      // Images
      const files = $('#f-images').files;
      if(files && files.length){
        const readers = [];
        for(const f of files){
          const reader = new FileReader();
          readers.push(new Promise(res=>{ reader.onload = ()=>res(reader.result); reader.readAsDataURL(f); }));
        }
        Promise.all(readers).then(urls=>{ state.attachments.images.push(...urls); renderAll(); });
      }else{
        renderAll();
      }
      $('#dlg-edit').close(); toast('編集を保存しました');
    }

    function openPrivacy(){
      const form = $('#form-privacy');
      $$('input[name="privacy"]', form).forEach(r=>{ r.checked = (r.value===state.privacy.level); });
      $('#dlg-privacy').showModal();
    }
    function applyPrivacy(){
      const val = $('input[name="privacy"]:checked', $('#form-privacy')).value;
      state.privacy.level = val;
      pushLog('公開レベル変更', val);
      renderAll(); $('#dlg-privacy').close(); toast('公開レベルを更新しました');
    }

    function openShare(){
      $('#sh-community').checked = state.share.community;
      $('#sh-gov').checked = state.share.government;
      $('#gov-opts').style.display = state.share.government ? 'block' : 'none';
      $$('input[name="gov-level"]').forEach(r=> r.checked = (r.value===state.share.government_level));
      $('#dlg-share').showModal();
    }

    function applyShare(){
      state.share.community = $('#sh-community').checked;
      state.share.government = $('#sh-gov').checked;
      if(state.share.government){ state.share.government_level = $('input[name="gov-level"]:checked').value; }
      // Status progression
      if(state.share.government){ state.status = 'shared_gov'; pushLog('共有', `行政（${state.share.government_level==='limited'?'限定':'集計'}）`); }
      else if(state.share.community){ state.status = 'shared_community'; pushLog('共有', 'コミュニティ'); }
      else { state.status = state.card_id ? 'saved' : 'draft'; }
      renderAll(); $('#dlg-share').close(); toast('共有設定を更新しました');
    }

    function copyJSON(){
      const json = JSON.stringify(state, null, 2);
      navigator.clipboard.writeText(json).then(()=>toast('JSONをコピーしました'));
    }

    function downloadJSON(){
      const blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${state.card_id||'card-draft'}.json`; a.click(); URL.revokeObjectURL(a.href);
    }

    function addKPI(){
      const v = $('#kpi-input').value.trim(); if(!v) return;
      if(state.kpi.length>=3){ toast('KPIは最大3件まで'); return; }
      state.kpi.push(v); $('#kpi-input').value='';
      const list = $('#kpi-list'); const idx=state.kpi.length-1; const el = document.createElement('span'); el.className='kpi-item'; el.innerHTML = `${v} <button type="button" data-idx="${idx}" class="ghost">×</button>`; list.appendChild(el);
    }

    function removeKPI(idx){ state.kpi.splice(idx,1); openEdit(); }
    // added: remove image
    function removeImage(idx){ state.attachments.images.splice(idx,1); pushLog('添付削除', '画像'); renderAll(); toast('画像を削除しました'); }

    function getGeo(){
      if(!navigator.geolocation){ toast('位置情報に対応していません'); return; }
      navigator.geolocation.getCurrentPosition(pos=>{
        state.attachments.location = { lat: pos.coords.latitude, lng: pos.coords.longitude, at: Date.now() };
        $('#geo-status').textContent = `緯度${state.attachments.location.lat.toFixed(5)}, 経度${state.attachments.location.lng.toFixed(5)}`;
        pushLog('位置情報付与');
      }, ()=> toast('位置情報の取得に失敗しました'));
    }

    // ---- Events ----
    $('#btn-save-anon').addEventListener('click', ()=>doSave('anonymous'));
    $('#btn-save-id').addEventListener('click', ()=>doSave('identified'));
    $('#btn-edit').addEventListener('click', openEdit);
    $('#btn-privacy').addEventListener('click', openPrivacy);
    $('#btn-share').addEventListener('click', openShare);

    $('#btn-json').addEventListener('click', copyJSON);
    $('#btn-download').addEventListener('click', downloadJSON);

    $('#kpi-add').addEventListener('click', addKPI);
    $('#kpi-list').addEventListener('click', (e)=>{ const idx=e.target?.dataset?.idx; if(idx!==undefined) removeKPI(Number(idx)); });

    $('#form-edit').addEventListener('submit', (e)=>{ e.preventDefault(); applyEdit(); });
    $('#btn-geo').addEventListener('click', getGeo);

    $('#form-privacy').addEventListener('submit', (e)=>{ e.preventDefault(); applyPrivacy(); });

    $('#form-share').addEventListener('submit', (e)=>{ e.preventDefault(); applyShare(); });
    $('#sh-gov').addEventListener('change', (e)=>{ $('#gov-opts').style.display = e.target.checked ? 'block' : 'none'; });
    // added: delegate delete clicks on images
    $('#v-attachments').addEventListener('click', (e)=>{ const t=e.target; if(t && t.classList && t.classList.contains('del-btn')){ const idx=Number(t.dataset.idx); if(!Number.isNaN(idx)) removeImage(idx); } });

    // ---- Init ----
    loadLocal();
    renderAll();
    renderConsent();
  </script>
</body>
</html>
