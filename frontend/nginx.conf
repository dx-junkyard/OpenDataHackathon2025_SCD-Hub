server {
  listen 80;
  server_name _;

  # 静的コンテンツ
  root /usr/share/nginx/html;
  index index.html;

  # /api をモックAPIへプロキシ（将来fetchを足す時にそのまま使える）
  location /api/ {
    proxy_pass http://api:8081/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

